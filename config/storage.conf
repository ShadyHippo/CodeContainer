# Buildah/podman storage, baked into the image at /etc/containers/storage.conf.
#
# driver = "vfs" is not a preference, it is a requirement: the container's own
# root filesystem is already overlayfs, and overlay-on-overlay is not allowed.
# vfs is slower and space-hungry (it copies whole layers rather than sharing
# them), which is why /var/lib/containers is worth bind-mounting to a real pool.
[storage]
driver = "vfs"
graphroot = "/var/lib/containers/storage"
runroot = "/run/containers/storage"

[storage.options]
# vfs has nothing to tune.
